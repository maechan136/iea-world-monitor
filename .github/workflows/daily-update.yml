name: Daily IEA World Monitor Update

on:
  # 毎朝6:00 JST（= UTC 21:00 前日）に自動実行
  schedule:
    - cron: '0 21 * * *'

  # 手動実行ボタン（GitHub Actions画面から起動可能）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ① リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ③ Claude Code インストール
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # ④ data ディレクトリ作成
      - name: Prepare directories
        run: mkdir -p data

      # ⑤ Claude Code でデータ収集 → HTML 生成（核心部分）
      - name: Run Claude Code update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_AUTO_MODE: "1"
        run: |
          claude \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,WebSearch,WebFetch" \
            -p "CLAUDE.mdの指示に従い、本日のIEAエネルギー情勢データを収集し、data/latest.jsonを更新してから、node update.jsを実行してindex.htmlを生成してください。"

      # ⑥ 更新されたファイルをコミット
      - name: Commit and push changes
        run: |
          git config --global user.name "IEA Monitor Bot"
          git config --global user.email "bot@iea-monitor.auto"
          git add data/latest.json index.html
          # 変更がある場合のみコミット
          git diff --staged --quiet || \
            git commit -m "chore: daily update $(date +'%Y-%m-%d %H:%M JST')"
          git push origin main

      # ⑦ Netlify に手動デプロイ（push後に自動デプロイが動かない場合の保険）
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy \
            --prod \
            --dir . \
            --site $NETLIFY_SITE_ID \
            --auth $NETLIFY_AUTH_TOKEN \
            --message "Daily auto-update $(date +'%Y-%m-%d')"
